<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إرث – تراث وهوية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#063D2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إرث">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'Noto Kufi Arabic';font-weight:400;font-style:normal;font-display:swap;src:url('noto-kufi-arabic-arabic-400-normal.woff2') format('woff2');}
@font-face{font-family:'Noto Kufi Arabic';font-weight:600;font-style:normal;font-display:swap;src:url('noto-kufi-arabic-arabic-600-normal.woff2') format('woff2');}
@font-face{font-family:'Noto Kufi Arabic';font-weight:700;font-style:normal;font-display:swap;src:url('noto-kufi-arabic-arabic-700-normal.woff2') format('woff2');}
@font-face{font-family:'Noto Kufi Arabic';font-weight:800;font-style:normal;font-display:swap;src:url('noto-kufi-arabic-arabic-800-normal.woff2') format('woff2');}
@font-face{font-family:'Tajawal';font-weight:400;font-style:normal;font-display:swap;src:url('tajawal-arabic-400-normal.woff2') format('woff2');}
@font-face{font-family:'Tajawal';font-weight:500;font-style:normal;font-display:swap;src:url('tajawal-arabic-500-normal.woff2') format('woff2');}
@font-face{font-family:'Tajawal';font-weight:700;font-style:normal;font-display:swap;src:url('tajawal-arabic-700-normal.woff2') format('woff2');}
</style>
<style>
  :root{
    --green:#0B6E4F; --green-deep:#063D2C; --red:#CE1126; --black:#14181A;
    --cream:#FBF8F1; --sand:#F1EAD9; --ink:#1B2220; --ink-soft:#64706C; --line:#E7E1D2;
    --card:#FFFFFF; --shadow: 0 1px 2px rgba(10,20,15,.06), 0 8px 20px -12px rgba(10,20,15,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg,#DCE4DE 0%, #C9D3CB 100%);
    color:var(--ink); font-family:'Tajawal', sans-serif; min-height:100vh; min-height:100dvh;
    display:flex; align-items:stretch; justify-content:center; padding:0;
  }

  /* ---------- هيكل التطبيق: شاشة كاملة على الهاتف، عمود متمركز على الشاشات الكبيرة ---------- */
  .phone{ width:100%; max-width:520px; background:var(--sand); position:relative; }
  .screen{
    background: var(--sand); overflow:hidden; height:100vh; height:100dvh;
    display:flex; flex-direction:column; position:relative;
  }
  .notch{ display:none; }
  .status-bar{
    min-height:calc(46px + env(safe-area-inset-top)); flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding: calc(6px + env(safe-area-inset-top)) 18px 0; font-size:13px; font-weight:700; color:var(--ink);
  }
  #clock{ display:none; }
  .status-bar .flagchip{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--ink-soft); }
  .status-bar .flagchip svg{ width:16px; height:11px; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.1); }
  @media (min-width:600px){
    body{ padding:20px 10px; align-items:center; }
    .phone{ max-width:440px; }
    .screen{ height:min(calc(100dvh - 40px), 920px); border-radius:28px; box-shadow:0 30px 60px -25px rgba(0,0,0,.45); }
  }
  .acct-btn{
    width:26px; height:26px; border-radius:50%; background:var(--card); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; flex-shrink:0;
  }
  .acct-btn{ color:#7d8a82; }
  .menu-btn{ color:var(--green-deep); }
  .acct-btn.logged{ background:var(--green); color:#fff; }

  /* ===== القائمة الجانبية للحساب ===== */
  .drawer-ov{ position:absolute; inset:0; z-index:60; background:rgba(6,30,22,.5); opacity:0; transition:opacity .22s; }
  .drawer-ov.open{ opacity:1; }
  .drawer{ position:absolute; top:0; bottom:0; width:min(84%,320px); background:var(--sand); box-shadow:0 0 40px rgba(0,0,0,.35);
    display:flex; flex-direction:column; transition:transform .25s ease; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
  .drawer.side-r{ right:0; transform:translateX(105%); border-radius:22px 0 0 22px; }
  .drawer.side-l{ left:0; transform:translateX(-105%); border-radius:0 22px 22px 0; }
  .drawer-ov.open .drawer{ transform:translateX(0); }
  .drawer-head{ background:var(--green-deep); color:#fff; padding:calc(26px + env(safe-area-inset-top)) 20px 20px; text-align:center; position:relative; }
  .drawer-close{ position:absolute; top:calc(10px + env(safe-area-inset-top)); inset-inline-start:12px; width:32px; height:32px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:15px; cursor:pointer; }
  .drawer-av{ width:76px; height:76px; border-radius:50%; margin:0 auto 10px; background:#F1EAD9; color:#9aa89f; overflow:hidden; padding-top:8px; box-sizing:border-box; border:3px solid rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:800; font-family:'Noto Kufi Arabic',sans-serif; }
  .drawer-name{ font-weight:800; font-size:17px; font-family:'Noto Kufi Arabic',sans-serif; }
  .drawer-mail{ font-size:12.5px; opacity:.8; margin-top:3px; direction:ltr; word-break:break-all; }
  .drawer-login{ margin-top:10px; background:#F1EAD9; color:var(--green-deep); border:0; border-radius:999px; padding:9px 22px; font-weight:800; font-family:'Tajawal',sans-serif; font-size:14px; cursor:pointer; }
  .drawer-list{ padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
  .drawer-item{ display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:12px; cursor:pointer; font-weight:700; font-size:14.5px; color:var(--ink); background:none; border:0; width:100%; text-align:start; font-family:'Tajawal',sans-serif; }
  .drawer-item:active,.drawer-item:hover{ background:rgba(6,61,44,.07); }
  .drawer-item .di-ic{ width:34px; height:34px; border-radius:10px; background:var(--card); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .drawer-item.danger{ color:#B3122D; }
  .drawer-sep{ height:1px; background:rgba(6,61,44,.12); margin:6px 10px; }
  .drawer-ver{ margin-top:auto; text-align:center; font-size:11.5px; color:var(--ink-soft); padding:10px; }

  .auth-form{ background:var(--card); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .auth-form label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; }
  .auth-form input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-family:'Tajawal',sans-serif; font-size:14px; outline:none; margin-bottom:14px; box-sizing:border-box;
  }
  .auth-form input:focus{ border-color:var(--green); }
  .auth-btn{
    width:100%; padding:13px; border:none; border-radius:14px; background:var(--green); color:#fff;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; margin-bottom:10px;
  }
  .auth-switch{ text-align:center; font-size:12.5px; color:var(--green-deep); font-weight:700; cursor:pointer; margin-top:6px; }
  .auth-status{ text-align:center; font-size:12.5px; margin-top:10px; min-height:16px; }
  .auth-status.ok{ color:var(--green-deep); font-weight:700; }
  .auth-status.bad{ color:var(--red); font-weight:700; }

  .profile-card{ background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); text-align:center; }
  .profile-card .avatar{ width:56px; height:56px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin:0 auto 10px; }
  .profile-card .pname{ font-weight:800; font-size:15px; color:var(--ink); }
  .profile-card .pemail{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .logout-btn{ margin-top:14px; padding:10px 18px; border-radius:12px; border:1px solid var(--red); background:#fff; color:var(--red); font-weight:700; font-size:13px; cursor:pointer; }
  .admin-link{ margin-top:12px; display:inline-block; padding:10px 18px; border-radius:12px; background:var(--green-deep); color:#fff; font-weight:700; font-size:13px; cursor:pointer; }

  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{ flex:1; background:var(--card); border-radius:14px; padding:14px; text-align:center; box-shadow:var(--shadow); }
  .stat-box b{ display:block; font-size:22px; color:var(--green-deep); font-family:'Noto Kufi Arabic', sans-serif; }
  .stat-box span{ font-size:11px; color:var(--ink-soft); }
  .feedback-card{ background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .feedback-card .fc-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .feedback-card .fc-name{ font-weight:700; font-size:13px; color:var(--ink); }
  .feedback-card .fc-stars{ font-size:12px; color:#F5B942; }
  .feedback-card .fc-msg{ font-size:13px; color:var(--ink); line-height:1.6; }
  .feedback-card .fc-date{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; }

  .content{ flex:1; overflow-y:auto; padding: 4px 18px calc(100px + env(safe-area-inset-bottom)); scrollbar-width:none; }

  .scroll-hint{
    position:absolute; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:34px; height:34px; border-radius:50%; background:var(--green);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.25); pointer-events:none;
    opacity:0; transition:opacity .25s ease; animation:scrollBounce 1.6s ease-in-out infinite;
    z-index:5;
  }
  .scroll-hint svg{ width:18px; height:18px; }
  .scroll-hint.show{ opacity:.92; }
  @keyframes scrollBounce{
    0%, 100% { transform:translateX(-50%) translateY(0); }
    50% { transform:translateX(-50%) translateY(6px); }
  }
  .content::-webkit-scrollbar{ display:none; }

  /* Bottom nav */
  .bottom-nav{
    position:absolute; bottom:0; left:0; right:0; height:calc(66px + max(16px, env(safe-area-inset-bottom)));
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-top:1px solid var(--line);
    display:flex; padding-bottom:max(16px, env(safe-area-inset-bottom)); z-index:10;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; font-size:10.5px; color: var(--ink-soft); cursor:pointer; font-weight:600; position:relative;
  }
  .nav-item .ic{ font-size:19px; line-height:1; }
  .nav-item.active{ color: var(--green-deep); font-weight:800; }
  .nav-item.active .ic{ transform: translateY(-1px); }
  .nav-badge{
    position:absolute; top:0; right:calc(50% - 20px); background:var(--red); color:#fff;
    font-size:9px; font-weight:800; border-radius:999px; padding:1px 5px; min-width:15px; text-align:center;
  }

  /* Typography helpers */
  h1,h2,h3,p{ margin:0; }
  .kufi{ font-family:'Noto Kufi Arabic', sans-serif; }
  .app-header{ padding: 14px 0 10px; }
  .app-header .greet{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .app-header .name{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:800; font-size:22px; color:var(--green-deep); }
  .app-header .brand-logo{ display:flex; justify-content:center; margin: 4px 0 -4px; }
  .app-header .brand-logo img{ height:76px; width:auto; display:block; }
  .app-header .brand-tagline{ text-align:center; font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:2px; margin-top:5px; }

  .cats-header{ padding: 12px 2px 4px; text-align:center; }
  .cats-header .cats-title{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:800; font-size:19px; color:var(--green-deep); }
  .cats-header .cats-tagline{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:4px; }

  /* Cards & sections */
  .section-title{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:700; font-size:15px; color:var(--green-deep); margin: 18px 2px 10px; display:flex; align-items:center; gap:6px; }

  .potd{
    background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
    border-radius:18px; padding:16px 18px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .potd::after{ content:""; position:absolute; inset:auto 0 0 0; height:5px; background: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff0 8px 16px); opacity:.35; }
  .potd .eyebrow{ font-size:10.5px; opacity:.8; font-weight:700; letter-spacing:.4px; }
  .potd .say{ font-family:'Noto Kufi Arabic', sans-serif; font-size:17px; font-weight:700; margin:6px 0 3px; }
  .potd .resp{ font-size:12.5px; opacity:.9; }
  .potd .en{ font-size:11px; opacity:.7; margin-top:6px; font-style:italic; }

  .mbz-quote{
    background: linear-gradient(135deg, #1a1a1a 0%, #063D2C 100%);
    border-radius:18px; padding:18px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden;
    border: 1px solid rgba(176,141,63,.4);
  }
  .mbz-quote::after{ content:""; position:absolute; inset:auto 0 0 0; height:4px; background:#B08D3F; opacity:.6; }
  .mbz-quote .mq-ic{ font-size:22px; margin-bottom:8px; }
  .mbz-quote .mq-body{ font-family:'Noto Kufi Arabic', sans-serif; font-size:15.5px; font-weight:700; line-height:1.7; }
  .mbz-quote .mq-attr{ font-size:11px; opacity:.75; margin-top:10px; color:#E8D9AE; }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding: 2px 0 6px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; font-size:12.5px; font-weight:700; color:var(--green-deep); cursor:pointer; box-shadow:var(--shadow);
  }

  .list-item{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; box-shadow:var(--shadow); transition: transform .12s ease;
  }
  .list-item:active{ transform: scale(.98); }
  .list-item .li-main{ display:flex; align-items:center; gap:12px; }
  .list-item .li-ic{
    width:38px; height:38px; border-radius:12px; background:var(--sand);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
  }
  .list-item .li-txt b{ font-size:14px; color:var(--ink); display:block; }
  .list-item .li-txt span{ font-size:11px; color:var(--ink-soft); }

  .grid-tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
  .grid-tile{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 10px; text-align:center; cursor:pointer; box-shadow:var(--shadow);
    transition: transform .12s ease; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .grid-tile:active{ transform: scale(.96); }
  .grid-tile .gt-ic{
    width:44px; height:44px; border-radius:13px; background:var(--sand);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .grid-tile .gt-eyebrow{ font-size:9.5px; font-weight:600; color:var(--ink-soft); margin-bottom:-2px; }
  .grid-tile .gt-title{ font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.3; }
  .grid-tile .gt-desc{ font-size:10px; color:var(--ink-soft); line-height:1.3; }

  .onboarding-overlay{
    position:absolute; inset:0; z-index:50; background:rgba(20,24,22,.55);
    display:flex; align-items:flex-end; justify-content:center; border-radius:34px; overflow:hidden;
  }
  .onboarding-card{
    background:var(--sand); width:100%; border-radius:28px 28px 0 0; padding:28px 24px 24px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
    animation: obSlideUp .3s ease;
  }
  @keyframes obSlideUp{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .onboarding-card .ob-ic{ font-size:52px; line-height:1; margin-bottom:6px; }
  .onboarding-card .ob-title{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:800; font-size:19px; color:var(--green-deep); }
  .onboarding-card .ob-desc{ font-size:13.5px; color:var(--ink); line-height:1.7; max-width:280px; }
  .ob-dots{ display:flex; gap:6px; margin:14px 0 18px; }
  .ob-dots span{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .ob-dots span.active{ background:var(--green); width:20px; border-radius:4px; }
  .ob-actions{ display:flex; gap:10px; width:100%; }
  .ob-next-btn{ flex:1; padding:13px; border:none; border-radius:14px; background:var(--green); color:#fff; font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .ob-skip-btn{ padding:13px 16px; border:none; background:transparent; color:var(--ink-soft); font-family:'Tajawal',sans-serif; font-weight:600; font-size:13px; cursor:pointer; }
  .list-item .chev{ color:var(--ink-soft); }

  .back-row{ display:flex; align-items:center; gap:8px; margin: 10px 0 14px; cursor:pointer; color:var(--green-deep); font-weight:700; font-size:13.5px; }

  .national-alert{
    background: linear-gradient(135deg, var(--red, #CE1126), #9c0d1c);
    border-radius:16px; padding:14px 16px; margin-bottom:14px;
    display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:var(--shadow);
  }
  .national-alert .na-ic{
    width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .national-alert .na-txt{ flex:1; }
  .national-alert .na-txt b{ font-size:14px; color:#fff; display:block; }
  .national-alert .na-txt span{ font-size:11.5px; color:rgba(255,255,255,.85); }
  .national-alert .chev{ color:#fff; }

  .detail-title{
    text-align:center; background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
    color:#fff; border-radius:18px; padding:20px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .detail-title h2{ font-family:'Noto Kufi Arabic', sans-serif; font-size:19px; font-weight:700; }
  .detail-title .dt-eyebrow{ font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:2px; }
  .detail-note{ font-size:12px; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:9px 14px; margin-bottom:14px; text-align:center; }

  .phrase-card{
    background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
    border-right:3px solid var(--green);
  }
  .phrase-card .row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .phrase-card .say{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:700; font-size:15px; color:var(--green-deep); }
  .phrase-card .say-en{ font-size:10.5px; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .phrase-card .actions{ display:flex; gap:6px; flex-shrink:0; }
  @font-face{ font-family:'IrthRuqaa'; font-weight:700; font-display:swap; src:url('aref-ruqaa-arabic-700-normal.woff2') format('woff2'); }
  @font-face{ font-family:'IrthNaskh'; font-weight:500; font-display:swap; src:url('noto-naskh-arabic-arabic-500-normal.woff2') format('woff2'); }
  @font-face{ font-family:'IrthNaskh'; font-weight:700; font-display:swap; src:url('noto-naskh-arabic-arabic-700-normal.woff2') format('woff2'); }
  @font-face{ font-family:'IrthSans'; font-weight:500; font-display:swap; src:url('alexandria-arabic-500-normal.woff2') format('woff2'); }
  @font-face{ font-family:'IrthSans'; font-weight:600; font-display:swap; src:url('alexandria-arabic-600-normal.woff2') format('woff2'); }
  @font-face{ font-family:'IrthSans'; font-weight:700; font-display:swap; src:url('alexandria-arabic-700-normal.woff2') format('woff2'); }
  @font-face{ font-family:'IrthSans'; font-weight:800; font-display:swap; src:url('alexandria-arabic-800-normal.woff2') format('woff2'); }
  .card-picker{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .card-pick{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:14px; border:1px solid var(--line); background:var(--sand); cursor:pointer; font-family:inherit; }
  .card-pick .cp-ic{ font-size:24px; } .card-pick .cp-t{ font-size:11.5px; font-weight:700; color:var(--green-deep); text-align:center; line-height:1.4; }
  .card-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .card-chip.sm{ padding:8px 12px; font-size:12px; }
  .card-chip b{ font-size:13px; color:var(--green-deep); } .card-chip span{ font-size:11.5px; color:var(--ink-soft); }
  .card-msg{ width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); font-family:inherit; font-size:13px; resize:vertical; line-height:1.7; }
  .card-check{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--ink-soft); }
  .card-open-btn.alt{ background:#fff; color:var(--green-deep); border:1.5px solid var(--green-deep); }
  .share-ic{ display:block; }
  .card-btn{ display:flex; align-items:center; justify-content:center; gap:7px; }
  .toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:var(--green-deep); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:10000; max-width:86vw; text-align:center; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .doc-body h3{ font-family:'Noto Kufi Arabic',sans-serif; font-size:14px; color:var(--green-deep); margin:16px 0 6px; }
  .doc-body p{ font-size:13px; line-height:1.9; color:var(--ink); margin:0 0 6px; }
  .doc-date{ font-size:11.5px !important; color:var(--ink-soft) !important; }
  .card-btn.danger{ background:var(--red); border-color:var(--red); color:#fff; }
  .list-item.danger .li-txt b{ color:var(--red); }
  .auth-forgot{ font-size:12.5px; color:var(--green); font-weight:700; cursor:pointer; margin:-4px 0 12px; }
  .card-open-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin:0 0 12px; padding:12px; border-radius:14px; border:none; background:var(--green-deep); color:#fff; font-family:'Noto Kufi Arabic', sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .card-modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9999; display:flex; align-items:flex-end; justify-content:center; }
  .card-panel{ position:relative; background:#fff; width:100%; max-width:480px; max-height:94vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:16px 16px 22px; }
  .card-close{ position:absolute; top:12px; left:12px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--sand); cursor:pointer; font-size:14px; }
  .card-title-row{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:800; font-size:15px; color:var(--green-deep); margin:2px 0 12px; }
  .card-canvas{ position:sticky; top:0; z-index:2; display:block; width:100%; max-height:36vh; object-fit:contain; border-radius:12px; box-shadow:var(--shadow); background:#eee; }
  .card-lbl{ font-size:11.5px; color:var(--ink-soft); margin:12px 2px 6px; font-weight:600; }
  .card-chips{ display:flex; flex-direction:column; gap:6px; }
  .card-chip{ text-align:start; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--sand); font-family:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; line-height:1.6; }
  .card-chip.on{ border-color:var(--green-deep); background:#fff; box-shadow:0 0 0 1.5px var(--green-deep) inset; font-weight:700; }
  .card-name{ width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--line); font-family:inherit; font-size:14px; }
  .card-actions{ display:flex; gap:8px; margin-top:14px; }
  .card-btn{ flex:1; padding:12px 8px; border-radius:12px; border:1px solid var(--green-deep); background:#fff; color:var(--green-deep); font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .card-btn.primary{ background:var(--green-deep); color:#fff; }
  .icon-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--sand);
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; color:var(--ink-soft);
    flex-shrink:0; text-decoration:none;
  }
  .icon-btn.fav.active{ background: var(--red); color:#fff; border-color:var(--red); }
  .phrase-card .divider{ height:1px; background:var(--line); margin:10px 0; }
  .phrase-card .resp{ font-size:13.5px; color:var(--ink); font-weight:600; }
  .phrase-card .resp-en{ font-size:10.5px; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .phrase-card .row2{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  .searchbox{ position:relative; margin: 6px 0 4px; }
  .searchbox input{
    width:100%; padding:12px 42px 12px 14px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); font-family:'Tajawal',sans-serif; font-size:14px; outline:none; box-shadow:var(--shadow);
  }
  .searchbox svg{ position:absolute; right:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); }

  .suggest-form{ background:var(--card); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .suggest-form label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; }
  .suggest-form .req{ color:var(--red); }
  .suggest-form input, .suggest-form textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-family:'Tajawal',sans-serif; font-size:14px; outline:none; margin-bottom:16px; box-sizing:border-box;
  }
  .suggest-form input:focus, .suggest-form textarea:focus{ border-color:var(--green); }
  .suggest-form textarea{ min-height:120px; resize:vertical; }
  .suggest-form .err{ color:var(--red); font-size:11.5px; margin:-10px 0 14px; display:none; }
  .suggest-form .err.show{ display:block; }
  .suggest-btn{
    width:100%; padding:13px; border:none; border-radius:14px; background:var(--green); color:#fff;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .suggest-btn:disabled{ opacity:.6; }
  .suggest-status{ text-align:center; font-size:13px; margin-top:12px; min-height:16px; }
  .suggest-status.ok{ color:var(--green-deep); font-weight:700; }
  .suggest-status.bad{ color:var(--red); font-weight:700; }

  .star-rating{ display:flex; gap:6px; margin-bottom:18px; font-size:30px; line-height:1; direction:ltr; justify-content:flex-start; }
  .star-rating .star{ color:#ddd; cursor:pointer; transition:color .15s ease, transform .1s ease; }
  .star-rating .star:hover{ transform:scale(1.12); }
  .star-rating .star.active{ color:#F5B942; }

  .ai-fab{
    position:absolute; left:16px; bottom:calc(78px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%;
    background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:0 6px 16px rgba(0,0,0,.3); cursor:pointer; z-index:6;
    animation: fabPulse 2.4s ease-in-out infinite;
    transition: opacity .2s ease, transform .2s ease;
  }
  .ai-fab.hidden{ opacity:0; transform:scale(.6); pointer-events:none; }
  @keyframes fabPulse{
    0%, 100% { box-shadow:0 6px 16px rgba(0,0,0,.3), 0 0 0 0 rgba(0,115,47,.4); }
    50% { box-shadow:0 6px 16px rgba(0,0,0,.3), 0 0 0 8px rgba(0,115,47,0); }
  }

  .chat-wrap{ display:flex; flex-direction:column; height:100%; }
  .chat-msgs{ display:flex; flex-direction:column; gap:10px; padding-bottom:8px; }
  .chat-bubble{ max-width:82%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.7; white-space:pre-line; }
  .chat-bubble.bot{ background:var(--card); box-shadow:var(--shadow); align-self:flex-start; border-bottom-left-radius:4px; }
  .chat-bubble.user{ background:var(--green); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .chat-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
  .chat-chip{
    background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 12px;
    font-size:11.5px; cursor:pointer; color:var(--green-deep); font-weight:700; box-shadow:var(--shadow);
  }
  .chat-input-row{
    display:flex; gap:8px; padding:10px 0 4px; position:sticky; bottom:0; background:var(--sand);
  }
  .chat-input-row input{
    flex:1; padding:12px 14px; border-radius:20px; border:1px solid var(--line);
    background:#fff; font-family:'Tajawal',sans-serif; font-size:14px; outline:none;
  }
  .chat-send-btn{
    width:44px; height:44px; border-radius:50%; border:none; background:var(--green); color:#fff;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }

  .heritage-card{ background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .heritage-card .h-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .heritage-card .h-ic{ font-size:20px; }
  .heritage-card h3{ font-family:'Noto Kufi Arabic', sans-serif; font-size:14.5px; color:var(--green-deep); font-weight:700; }
  .heritage-card p{ font-size:12.5px; color:var(--ink-soft); line-height:1.8; }
  .heritage-card ol{ margin:6px 0 0; padding-inline-start:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.9; }

  .tourist-row{
    background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .tourist-row .t-txt b{ font-family:'Noto Kufi Arabic', sans-serif; font-size:14px; color:var(--green-deep); display:block; }
  .tourist-row .t-txt .translit{ font-size:11px; color:var(--red); font-weight:700; }
  .tourist-row .t-txt .en{ font-size:11px; color:var(--ink-soft); }

  .empty-state{ text-align:center; color:var(--ink-soft); font-size:13px; padding: 60px 20px; line-height:1.8; }
  .empty-state .em-ic{ font-size:34px; display:block; margin-bottom:10px; }

  .note-banner{
    font-size:11px; color:var(--ink-soft); background:rgba(11,110,79,.08); border-radius:10px; padding:8px 12px; margin: 6px 0 14px; text-align:center;
  }
</style>
