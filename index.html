<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>البروتوكول الإماراتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#063D2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البروتوكول">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0B6E4F; --green-deep:#063D2C; --red:#CE1126; --black:#14181A;
    --cream:#FBF8F1; --sand:#F1EAD9; --ink:#1B2220; --ink-soft:#64706C; --line:#E7E1D2;
    --card:#FFFFFF; --shadow: 0 1px 2px rgba(10,20,15,.06), 0 8px 20px -12px rgba(10,20,15,.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg,#DCE4DE 0%, #C9D3CB 100%);
    color:var(--ink); font-family:'Tajawal', sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding: 24px 10px;
  }

  /* ---------- Phone shell ---------- */
  .phone{
    width: 380px; max-width: 100%;
    background: var(--black);
    border-radius: 46px;
    padding: 12px;
    box-shadow: 0 40px 70px -25px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.04) inset;
    position: relative;
  }
  .screen{
    background: var(--sand);
    border-radius: 34px;
    overflow:hidden;
    height: 800px;
    display:flex; flex-direction:column;
    position:relative;
  }
  .notch{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:110px; height:22px; background:var(--black); border-radius:12px; z-index:20;
  }
  .status-bar{
    height:46px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding: 6px 22px 0; font-size:13px; font-weight:700; color:var(--ink);
  }
  .status-bar .flagchip{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--ink-soft); }
  .status-bar .flagchip svg{ width:16px; height:11px; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.1); }
  .acct-btn{
    width:26px; height:26px; border-radius:50%; background:var(--card); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; flex-shrink:0;
  }
  .acct-btn.logged{ background:var(--green); color:#fff; font-weight:800; font-size:11px; }

  .auth-form{ background:var(--card); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .auth-form label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; }
  .auth-form input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-family:'Tajawal',sans-serif; font-size:14px; outline:none; margin-bottom:14px; box-sizing:border-box;
  }
  .auth-form input:focus{ border-color:var(--green); }
  .auth-btn{
    width:100%; padding:13px; border:none; border-radius:14px; background:var(--green); color:#fff;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; margin-bottom:10px;
  }
  .auth-switch{ text-align:center; font-size:12.5px; color:var(--green-deep); font-weight:700; cursor:pointer; margin-top:6px; }
  .auth-status{ text-align:center; font-size:12.5px; margin-top:10px; min-height:16px; }
  .auth-status.ok{ color:var(--green-deep); font-weight:700; }
  .auth-status.bad{ color:var(--red); font-weight:700; }

  .profile-card{ background:var(--card); border-radius:16px; padding:16px; box-shadow:var(--shadow); text-align:center; }
  .profile-card .avatar{ width:56px; height:56px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; margin:0 auto 10px; }
  .profile-card .pname{ font-weight:800; font-size:15px; color:var(--ink); }
  .profile-card .pemail{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .logout-btn{ margin-top:14px; padding:10px 18px; border-radius:12px; border:1px solid var(--red); background:#fff; color:var(--red); font-weight:700; font-size:13px; cursor:pointer; }
  .admin-link{ margin-top:12px; display:inline-block; padding:10px 18px; border-radius:12px; background:var(--green-deep); color:#fff; font-weight:700; font-size:13px; cursor:pointer; }

  .stat-row{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{ flex:1; background:var(--card); border-radius:14px; padding:14px; text-align:center; box-shadow:var(--shadow); }
  .stat-box b{ display:block; font-size:22px; color:var(--green-deep); font-family:'Noto Kufi Arabic', sans-serif; }
  .stat-box span{ font-size:11px; color:var(--ink-soft); }
  .feedback-card{ background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .feedback-card .fc-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .feedback-card .fc-name{ font-weight:700; font-size:13px; color:var(--ink); }
  .feedback-card .fc-stars{ font-size:12px; color:#F5B942; }
  .feedback-card .fc-msg{ font-size:13px; color:var(--ink); line-height:1.6; }
  .feedback-card .fc-date{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; }

  .content{ flex:1; overflow-y:auto; padding: 4px 18px 100px; scrollbar-width:none; }

  .scroll-hint{
    position:absolute; left:50%; bottom:78px; transform:translateX(-50%);
    width:34px; height:34px; border-radius:50%; background:var(--green);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.25); pointer-events:none;
    opacity:0; transition:opacity .25s ease; animation:scrollBounce 1.6s ease-in-out infinite;
    z-index:5;
  }
  .scroll-hint svg{ width:18px; height:18px; }
  .scroll-hint.show{ opacity:.92; }
  @keyframes scrollBounce{
    0%, 100% { transform:translateX(-50%) translateY(0); }
    50% { transform:translateX(-50%) translateY(6px); }
  }
  .content::-webkit-scrollbar{ display:none; }

  /* Bottom nav */
  .bottom-nav{
    position:absolute; bottom:0; left:0; right:0; height:82px;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-top:1px solid var(--line);
    display:flex; padding-bottom:16px; z-index:10;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; font-size:10.5px; color: var(--ink-soft); cursor:pointer; font-weight:600; position:relative;
  }
  .nav-item .ic{ font-size:19px; line-height:1; }
  .nav-item.active{ color: var(--green-deep); font-weight:800; }
  .nav-item.active .ic{ transform: translateY(-1px); }
  .nav-badge{
    position:absolute; top:0; right:calc(50% - 20px); background:var(--red); color:#fff;
    font-size:9px; font-weight:800; border-radius:999px; padding:1px 5px; min-width:15px; text-align:center;
  }

  /* Typography helpers */
  h1,h2,h3,p{ margin:0; }
  .kufi{ font-family:'Noto Kufi Arabic', sans-serif; }
  .app-header{ padding: 14px 0 10px; }
  .app-header .greet{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .app-header .name{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:800; font-size:22px; color:var(--green-deep); }
  .app-header .brand-logo{ display:flex; justify-content:center; margin: 4px 0 2px; }
  .app-header .brand-logo img{ height:76px; width:auto; display:block; }

  .cats-header{ padding: 12px 2px 4px; text-align:center; }
  .cats-header .cats-title{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:800; font-size:19px; color:var(--green-deep); }
  .cats-header .cats-tagline{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:4px; }

  /* Cards & sections */
  .section-title{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:700; font-size:15px; color:var(--green-deep); margin: 18px 2px 10px; display:flex; align-items:center; gap:6px; }

  .potd{
    background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
    border-radius:18px; padding:16px 18px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .potd::after{ content:""; position:absolute; inset:auto 0 0 0; height:5px; background: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff0 8px 16px); opacity:.35; }
  .potd .eyebrow{ font-size:10.5px; opacity:.8; font-weight:700; letter-spacing:.4px; }
  .potd .say{ font-family:'Noto Kufi Arabic', sans-serif; font-size:17px; font-weight:700; margin:6px 0 3px; }
  .potd .resp{ font-size:12.5px; opacity:.9; }
  .potd .en{ font-size:11px; opacity:.7; margin-top:6px; font-style:italic; }

  .mbz-quote{
    background: linear-gradient(135deg, #1a1a1a 0%, #063D2C 100%);
    border-radius:18px; padding:18px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden;
    border: 1px solid rgba(176,141,63,.4);
  }
  .mbz-quote::after{ content:""; position:absolute; inset:auto 0 0 0; height:4px; background:#B08D3F; opacity:.6; }
  .mbz-quote .mq-ic{ font-size:22px; margin-bottom:8px; }
  .mbz-quote .mq-body{ font-family:'Noto Kufi Arabic', sans-serif; font-size:15.5px; font-weight:700; line-height:1.7; }
  .mbz-quote .mq-attr{ font-size:11px; opacity:.75; margin-top:10px; color:#E8D9AE; }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding: 2px 0 6px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; font-size:12.5px; font-weight:700; color:var(--green-deep); cursor:pointer; box-shadow:var(--shadow);
  }

  .list-item{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; box-shadow:var(--shadow); transition: transform .12s ease;
  }
  .list-item:active{ transform: scale(.98); }
  .list-item .li-main{ display:flex; align-items:center; gap:12px; }
  .list-item .li-ic{
    width:38px; height:38px; border-radius:12px; background:var(--sand);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;
  }
  .list-item .li-txt b{ font-size:14px; color:var(--ink); display:block; }
  .list-item .li-txt span{ font-size:11px; color:var(--ink-soft); }
  .list-item .chev{ color:var(--ink-soft); }

  .back-row{ display:flex; align-items:center; gap:8px; margin: 10px 0 14px; cursor:pointer; color:var(--green-deep); font-weight:700; font-size:13.5px; }

  .national-alert{
    background: linear-gradient(135deg, var(--red, #CE1126), #9c0d1c);
    border-radius:16px; padding:14px 16px; margin-bottom:14px;
    display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:var(--shadow);
  }
  .national-alert .na-ic{
    width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .national-alert .na-txt{ flex:1; }
  .national-alert .na-txt b{ font-size:14px; color:#fff; display:block; }
  .national-alert .na-txt span{ font-size:11.5px; color:rgba(255,255,255,.85); }
  .national-alert .chev{ color:#fff; }

  .detail-title{
    text-align:center; background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
    color:#fff; border-radius:18px; padding:20px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .detail-title h2{ font-family:'Noto Kufi Arabic', sans-serif; font-size:19px; font-weight:700; }
  .detail-note{ font-size:12px; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:9px 14px; margin-bottom:14px; text-align:center; }

  .phrase-card{
    background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
    border-right:3px solid var(--green);
  }
  .phrase-card .row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .phrase-card .say{ font-family:'Noto Kufi Arabic', sans-serif; font-weight:700; font-size:15px; color:var(--green-deep); }
  .phrase-card .say-en{ font-size:10.5px; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .phrase-card .actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--sand);
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; color:var(--ink-soft);
    flex-shrink:0; text-decoration:none;
  }
  .icon-btn.fav.active{ background: var(--red); color:#fff; border-color:var(--red); }
  .phrase-card .divider{ height:1px; background:var(--line); margin:10px 0; }
  .phrase-card .resp{ font-size:13.5px; color:var(--ink); font-weight:600; }
  .phrase-card .resp-en{ font-size:10.5px; color:var(--ink-soft); font-style:italic; margin-top:2px; }
  .phrase-card .row2{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  .searchbox{ position:relative; margin: 6px 0 4px; }
  .searchbox input{
    width:100%; padding:12px 42px 12px 14px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); font-family:'Tajawal',sans-serif; font-size:14px; outline:none; box-shadow:var(--shadow);
  }
  .searchbox svg{ position:absolute; right:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); }

  .suggest-form{ background:var(--card); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .suggest-form label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:0 0 6px; }
  .suggest-form .req{ color:var(--red); }
  .suggest-form input, .suggest-form textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:#fff; font-family:'Tajawal',sans-serif; font-size:14px; outline:none; margin-bottom:16px; box-sizing:border-box;
  }
  .suggest-form input:focus, .suggest-form textarea:focus{ border-color:var(--green); }
  .suggest-form textarea{ min-height:120px; resize:vertical; }
  .suggest-form .err{ color:var(--red); font-size:11.5px; margin:-10px 0 14px; display:none; }
  .suggest-form .err.show{ display:block; }
  .suggest-btn{
    width:100%; padding:13px; border:none; border-radius:14px; background:var(--green); color:#fff;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .suggest-btn:disabled{ opacity:.6; }
  .suggest-status{ text-align:center; font-size:13px; margin-top:12px; min-height:16px; }
  .suggest-status.ok{ color:var(--green-deep); font-weight:700; }
  .suggest-status.bad{ color:var(--red); font-weight:700; }

  .star-rating{ display:flex; gap:6px; margin-bottom:18px; font-size:30px; line-height:1; direction:ltr; justify-content:flex-start; }
  .star-rating .star{ color:#ddd; cursor:pointer; transition:color .15s ease, transform .1s ease; }
  .star-rating .star:hover{ transform:scale(1.12); }
  .star-rating .star.active{ color:#F5B942; }

  .ai-fab{
    position:absolute; left:16px; bottom:78px; width:52px; height:52px; border-radius:50%;
    background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:0 6px 16px rgba(0,0,0,.3); cursor:pointer; z-index:6;
    animation: fabPulse 2.4s ease-in-out infinite;
    transition: opacity .2s ease, transform .2s ease;
  }
  .ai-fab.hidden{ opacity:0; transform:scale(.6); pointer-events:none; }
  @keyframes fabPulse{
    0%, 100% { box-shadow:0 6px 16px rgba(0,0,0,.3), 0 0 0 0 rgba(0,115,47,.4); }
    50% { box-shadow:0 6px 16px rgba(0,0,0,.3), 0 0 0 8px rgba(0,115,47,0); }
  }

  .chat-wrap{ display:flex; flex-direction:column; height:100%; }
  .chat-msgs{ display:flex; flex-direction:column; gap:10px; padding-bottom:8px; }
  .chat-bubble{ max-width:82%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.7; white-space:pre-line; }
  .chat-bubble.bot{ background:var(--card); box-shadow:var(--shadow); align-self:flex-start; border-bottom-left-radius:4px; }
  .chat-bubble.user{ background:var(--green); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .chat-suggest-row{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
  .chat-chip{
    background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 12px;
    font-size:11.5px; cursor:pointer; color:var(--green-deep); font-weight:700; box-shadow:var(--shadow);
  }
  .chat-input-row{
    display:flex; gap:8px; padding:10px 0 4px; position:sticky; bottom:0; background:var(--sand);
  }
  .chat-input-row input{
    flex:1; padding:12px 14px; border-radius:20px; border:1px solid var(--line);
    background:#fff; font-family:'Tajawal',sans-serif; font-size:14px; outline:none;
  }
  .chat-send-btn{
    width:44px; height:44px; border-radius:50%; border:none; background:var(--green); color:#fff;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }

  .heritage-card{ background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .heritage-card .h-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .heritage-card .h-ic{ font-size:20px; }
  .heritage-card h3{ font-family:'Noto Kufi Arabic', sans-serif; font-size:14.5px; color:var(--green-deep); font-weight:700; }
  .heritage-card p{ font-size:12.5px; color:var(--ink-soft); line-height:1.8; }
  .heritage-card ol{ margin:6px 0 0; padding-inline-start:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.9; }

  .tourist-row{
    background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:9px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .tourist-row .t-txt b{ font-family:'Noto Kufi Arabic', sans-serif; font-size:14px; color:var(--green-deep); display:block; }
  .tourist-row .t-txt .translit{ font-size:11px; color:var(--red); font-weight:700; }
  .tourist-row .t-txt .en{ font-size:11px; color:var(--ink-soft); }

  .empty-state{ text-align:center; color:var(--ink-soft); font-size:13px; padding: 60px 20px; line-height:1.8; }
  .empty-state .em-ic{ font-size:34px; display:block; margin-bottom:10px; }

  .note-banner{
    font-size:11px; color:var(--ink-soft); background:rgba(11,110,79,.08); border-radius:10px; padding:8px 12px; margin: 6px 0 14px; text-align:center;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="status-bar">
      <span id="clock">9:41</span>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="flagchip">
          <svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#00732F"/><rect y="13.3" width="60" height="13.3" fill="#fff"/><rect y="26.6" width="60" height="13.4" fill="#000"/><rect width="15" height="40" fill="#CE1126"/></svg>
          الإمارات
        </div>
        <div class="acct-btn" id="acctBtn" title="حسابي">👤</div>
      </div>
    </div>

    <div class="content" id="content"></div>
    <div class="scroll-hint" id="scrollHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
    <div class="ai-fab" id="aiFab" title="المساعد الذكي">🤖</div>

    <div class="bottom-nav">
      <div class="nav-item" data-tab="home"><span class="ic">🏠</span>الرئيسية</div>
      <div class="nav-item" data-tab="categories"><span class="ic">📖</span>المناسبات</div>
      <div class="nav-item" data-tab="tourist"><span class="ic">🧭</span>للزوار</div>
      <div class="nav-item" data-tab="heritage"><span class="ic">🏺</span>الإمارات</div>
      <div class="nav-item" data-tab="favorites"><span class="ic">❤️</span>المفضلة<span class="nav-badge" id="favBadge" style="display:none">0</span></div>
    </div>
  </div>
</div>

/* ===================== NATIONAL DAYS REMINDER ===================== */
function getFirstThursday(year, month){
  // month is 1-indexed
  const d = new Date(year, month-1, 1);
  const dow = d.getDay(); // 0=Sun ... 4=Thu
  const offset = (4 - dow + 7) % 7;
  return new Date(year, month-1, 1 + offset);
}

function nextOccurrence(evt){
  const now = new Date();
  const y = now.getFullYear();
  let target;
  if(evt.firstThursday){
    target = getFirstThursday(y, evt.month);
    if(target < new Date(now.getFullYear(), now.getMonth(), now.getDate())){
      target = getFirstThursday(y+1, evt.month);
    }
  } else {
    target = new Date(y, evt.month-1, evt.day);
    if(target < new Date(now.getFullYear(), now.getMonth(), now.getDate())){
      target = new Date(y+1, evt.month-1, evt.day);
    }
  }
  return target;
}

function upcomingNationalDays(withinDays){
  const today = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  return nationalDays.map(evt => {
    const target = nextOccurrence(evt);
    const days = Math.round((target - today) / 86400000);
    return {...evt, daysUntil: days};
  }).filter(evt => evt.daysUntil >= 0 && evt.daysUntil <= withinDays)
    .sort((a,b) => a.daysUntil - b.daysUntil);
}

async function requestNationalDayNotifications(){
  if(!('Notification' in window)){
    alert('متصفحك لا يدعم الإشعارات');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    try{ localStorage.setItem('notif-enabled', 'true'); }catch(e){}
    notifEnabled = true;
    checkAndFireNotification();
    render();
  }
}

async function isNotifEnabled(){
  try{
    return localStorage.getItem('notif-enabled') === 'true' && Notification.permission === 'granted';
  }catch(e){ return false; }
}

async function checkAndFireNotification(){
  if(Notification.permission !== 'granted') return;
  const soon = upcomingNationalDays(7);
  if(soon.length === 0) return;
  const todayKey = new Date().toISOString().slice(0,10);
  let lastFired = null;
  try{ lastFired = localStorage.getItem('notif-last-fired'); }catch(e){}
  if(lastFired === todayKey) return;
  const evt = soon[0];
  const msg = evt.daysUntil === 0 ? `اليوم! ${evt.name} 🇦🇪` : `${evt.name} بعد ${evt.daysUntil} ${evt.daysUntil===1?'يوم':'أيام'}`;
  new Notification('البروتوكول الإماراتي', { body: msg, icon: 'icon-192.png' });
  try{ localStorage.setItem('notif-last-fired', todayKey); }catch(e){}
}

async function loadFavorites(){
  if(!currentUser){ favorites = []; favLoaded = true; updateFavBadge(); return; }
  try{
    const doc = await db.collection('users').doc(currentUser.uid).get();
    favorites = (doc.exists && doc.data().favorites) ? doc.data().favorites : [];
  }catch(e){ favorites = []; }
  favLoaded = true;
  updateFavBadge();
}
async function saveFavorites(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({ favorites }, { merge: true });
  }catch(e){}
}
function isFav(id){ return favorites.includes(id); }
function toggleFav(id){
  if(!currentUser){
    currentTab = 'account';
    authMode = 'login';
    render();
    return;
  }
  if(isFav(id)) favorites = favorites.filter(f => f !== id);
  else favorites.push(id);
  saveFavorites();
  updateFavBadge();
  render();
}
function updateFavBadge(){
  const b = document.getElementById('favBadge');
  if(!b) return;
  if(favorites.length > 0){ b.style.display='block'; b.textContent = favorites.length; }
  else b.style.display='none';
}

function speak(text){
  if(!('speechSynthesis' in window)){ alert('المتصفح لا يدعم النطق الصوتي حالياً'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA'; u.rate = 0.82;
  window.speechSynthesis.speak(u);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function googleMapsUrl(name, place){
  const q = encodeURIComponent(`${name} ${place} الإمارات`);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

let adminStats = null;
async function loadAdminStats(){
  try{
    const feedbackSnap = await db.collection('feedback').orderBy('createdAt', 'desc').get();
    const usersSnap = await db.collection('users').get();
    const items = feedbackSnap.docs.map(d => d.data());
    const ratings = items.filter(i => i.rating > 0).map(i => i.rating);
    const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0) / ratings.length) : 0;
    adminStats = { items, total: items.length, avg: avg.toFixed(1), usersCount: usersSnap.size };
  }catch(e){

  }
  render();
}

let __knowledgeBaseCache = null;
function buildKnowledgeBase(){
  if(__knowledgeBaseCache) return __knowledgeBaseCache;
  const kb = [];
  const add = (q, a) => kb.push({q: q, a: a});

  // المناسبات وعبارات البروتوكول
  Object.keys(protocolData).forEach(cat => {
    const c = protocolData[cat];
    const itemsTxt = c.items.map(it => `تقول: "${it.s}" ويكون الرد: "${it.r}"`).join(' — ');
    add(`${cat} ${c.note}`, `في مناسبة "${cat}": ${c.note}\nمن العبارات المستخدمة: ${itemsTxt}`);
  });

  // عبارات للزوار
  touristPhrases.forEach(p => {
    add(`${p.s} ${p.se||''} عبارة سائح زائر`, `عبارة "${p.s}" (${p.se||''}) من العبارات المفيدة للزوار في الإمارات.`);
  });

  // بطاقات التراث العام (ألوان العلم، القهوة، اللباس، الغوص، المجلس)
  heritageCards.forEach(h => {
    const stepsTxt = h.steps ? (' خطواتها: ' + h.steps.join('، ')) : '';
    add(`${h.title} ${h.body}`, `${h.title}: ${h.body}${stepsTxt}`);
  });

  // الأكلات الشعبية
  traditionalFood.forEach(f => {
    add(`${f.name} أكلة طبق شعبي طعام إماراتي`, `${f.name}: ${f.body}`);
  });

  // الأهازيج والفنون الشعبية
  ahazeejList.forEach(a => {
    add(`${a.name} هزيج رقصة فن شعبي`, `${a.name}: ${a.body}`);
  });

  // السباقات التراثية
  traditionalRaces.forEach(r => {
    add(`${r.name} سباق رياضة تراثية`, `${r.name}: ${r.body}`);
  });

  // الألعاب التراثية
  traditionalGames.forEach(g => {
    add(`${g.name} لعبة تراثية شعبية`, `لعبة ${g.name}: ${g.body}`);
  });

  // الأمثال الشعبية
  folkProverbs.forEach(p => {
    add(`مثل شعبي ${p.name}`, `المثل الشعبي "${p.name}" معناه: ${p.body}`);
  });

  // أقوال الشيخ زايد
  zayedQuotes.forEach(q => {
    add(`قول مقولة الشيخ زايد ${q.name}`, `من أقوال الشيخ زايد بن سلطان آل نهيان رحمه الله عن ${q.name}: "${q.body}"`);
  });

  // أقوال الشيخ محمد بن زايد
  mbzQuotes.forEach(q => {
    add(`قول مقولة الشيخ محمد بن زايد ${q.name}`, `من أقوال الشيخ محمد بن زايد آل نهيان حفظه الله عن ${q.name}: "${q.body}"`);
  });

  // المعالم السياحية
  landmarksData.forEach(l => {
    add(`${l.name} معلم سياحي ${l.body}`, `${l.name} (${l.body}): ${l.desc || 'من أبرز المعالم السياحية في الإمارات.'}`);
  });

  // المواقع والمعالم الأثرية
  archaeologicalSites.forEach(l => {
    add(`${l.name} موقع أثري تاريخي ${l.body}`, `${l.name} (${l.body}): ${l.desc || 'من المواقع الأثرية المهمة في الإمارات.'}`);
  });

  // المناسبات والأيام الوطنية
  nationalDays.forEach(n => {
    add(`${n.name} يوم وطني مناسبة`, `${n.name}: ${n.body}`);
  });

  // النشيد الوطني
  add(`النشيد الوطني عيشي بلادي السلام الوطني كلمات النشيد`,
    `${nationalAnthem.title}\n${nationalAnthem.meta}\nمن كلماته: "${nationalAnthem.lines.slice(0,3).join(' ')}"`);

  // فيديو تاريخي
  add(`فيديو وثائقي الإمارات عبر التاريخ`, `فيه فيديو وثائقي بعنوان "الإمارات عبر التاريخ" يستعرض مسيرة الدولة، تلقاه بقسم "الهوية الوطنية" ضمن تبويب "الإمارات".`);

  // نظام الحكم
  add(`نظام الحكم القيادة الاتحاد المجلس الأعلى`, governanceInfo.intro + ' ' + governanceInfo.points.join(' '));
  add(`رئيس الدولة من هو الرئيس`, `رئيس دولة الإمارات هو ${governanceInfo.president.name}، ${governanceInfo.president.title}.`);
  governanceInfo.vicePresidents.forEach(v => add(`نائب رئيس الدولة ${v.name}`, `${v.name}: ${v.title}.`));
  governanceInfo.emirates.forEach(e => add(`حاكم إمارة ${e.emirate} ولي عهد ${e.emirate}`, `حاكم إمارة ${e.emirate} هو ${e.ruler}، وولي عهدها ${e.crown}.`));

  // مفردات ولهجة
  heritageWords.forEach(w => add(`معنى كلمة ${w.w}`, `كلمة "${w.w}" تعني: ${w.m}`));

  // معرفة عامة
  generalKnowledge.forEach(g => add(g.q, g.a));

  __knowledgeBaseCache = kb;
  return kb;
}

function normalizeArabic(s){
  return (s||'')
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[ًٌٍَُِّْ]/g,'')
    .replace(/[^\u0600-\u06FF\s]/g,' ')
    .toLowerCase().trim();
}

const STOPWORDS = new Set(['ما','ماهو','ماهي','هو','هي','عن','في','من','الى','إلى','كيف','متى','اين','أين','مين','من','هل','لو','و','ثم','أو','او','يا','لي','لك','كم','اش','وش','شو','ايش','التطبيق','تطبيق','معني','معناه','معناها','كلمه','يعني','قول','مقوله','تقصد','ودي','ابي','ابغي','اريد']);

function searchKnowledge(query){
  const kb = buildKnowledgeBase();
  const qNorm = normalizeArabic(query);
  const words = qNorm.split(/\s+/).filter(w => w.length >= 2 && !STOPWORDS.has(w));
  if(words.length === 0) return [];

  const scored = kb.map(entry => {
    const entryNorm = normalizeArabic(entry.q + ' ' + entry.a);
    let score = 0;
    let matchedWords = 0;
    words.forEach(w => { if(entryNorm.includes(w)){ score += w.length; matchedWords++; } });
    return {entry, score, matchedWords};
  }).filter(x => x.score > 0 && x.matchedWords / words.length >= 0.5);

  scored.sort((a,b) => b.score - a.score);
  return scored.slice(0, 2).map(x => x.entry);
}

  return `

      <div class="h-top"><span class="h-ic">${icon}</span><h3>${escapeHtml(title)}</h3></div>
      <p>${escapeHtml(body)}</p>
      ${steps ? `<ol>${steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>` : ''}

  }
  if(favorites.length === 0){
    return `<div class="app-header"><div class="name kufi">❤️ المفضلة</div></div>
    <div class="empty-state"><span class="em-ic">💔</span>ما حفظت أي عبارة بعد.<br>اضغط على ❤ بأي عبارة عشان تضيفها هنا.</div>`;
  }
  const all = allItemsFlat();
  const favItems = favorites.map(id => {
    const [cat, idxStr] = id.split('|');
    const idx = parseInt(idxStr,10);
    const it = protocolData[cat] && protocolData[cat].items[idx];

  }).filter(Boolean);

function render(){
  const content = document.getElementById('content');
  let html = '';
  if(currentTab === 'home') html = renderHome();
  else if(currentTab === 'categories') html = catDetail ? renderCategoryDetail(catDetail) : renderCategoriesList(window.__lastSearch);
  else if(currentTab === 'tourist') html = renderTourist();
  else if(currentTab === 'heritage') html = renderHeritage();
  else if(currentTab === 'favorites') html = renderFavorites();
  else if(currentTab === 'suggest') html = renderSuggest();
  else if(currentTab === 'assistant') html = renderAssistant();
  else if(currentTab === 'account') html = renderAccount();
  else if(currentTab === 'admin') html = renderAdmin();
  content.innerHTML = html;
  content.scrollTop = 0;

  const aiFabEl = document.getElementById('aiFab');
  if(aiFabEl) aiFabEl.classList.toggle('hidden', currentTab === 'assistant');

  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === currentTab));

  content.querySelectorAll('[data-open-cat]').forEach(el => el.addEventListener('click', () => {
    currentTab = 'categories'; catDetail = el.dataset.openCat; render();
  }));
  content.querySelectorAll('[data-tab-link]').forEach(el => el.addEventListener('click', () => {
    currentTab = el.dataset.tabLink; catDetail = null; heritageSection = null; render();
  }));
  const backEl = content.querySelector('[data-back-cats]');
  if(backEl) backEl.addEventListener('click', () => { catDetail = null; render(); });
  content.querySelectorAll('[data-open-heritage]').forEach(el => el.addEventListener('click', () => {
    heritageSection = el.dataset.openHeritage; render();
  }));
  const backHeritageEl = content.querySelector('[data-back-heritage]');
  if(backHeritageEl) backHeritageEl.addEventListener('click', () => { heritageSection = null; render(); });
  const backSuggestEl = content.querySelector('[data-back-suggest]');
  if(backSuggestEl) backSuggestEl.addEventListener('click', () => { currentTab = 'home'; render(); });
  const backAdminEl = content.querySelector('[data-back-admin]');
  if(backAdminEl) backAdminEl.addEventListener('click', () => { currentTab = 'account'; render(); });
  content.querySelectorAll('[data-go-account]').forEach(el => el.addEventListener('click', () => { currentTab = 'account'; authMode = 'login'; render(); }));
  const goAdminEl = content.querySelector('[data-go-admin]');
  if(goAdminEl) goAdminEl.addEventListener('click', () => { adminStats = null; currentTab = 'admin'; render(); });
  const logoutBtnEl = document.getElementById('logoutBtn');
  if(logoutBtnEl) logoutBtnEl.addEventListener('click', () => { auth.signOut(); });
  const authSwitchBtnEl = document.getElementById('authSwitchBtn');
  if(authSwitchBtnEl) authSwitchBtnEl.addEventListener('click', () => {
    authMode = (authMode === 'login') ? 'signup' : 'login'; render();
  });
  const authSubmitBtnEl = document.getElementById('authSubmitBtn');
  if(authSubmitBtnEl){
    authSubmitBtnEl.addEventListener('click', async () => {
      const emailEl = document.getElementById('auth-email');
      const passEl = document.getElementById('auth-password');
      const nameEl = document.getElementById('auth-name');
      const statusEl = document.getElementById('authStatus');
      const email = emailEl.value.trim();
      const password = passEl.value;
      statusEl.className = 'auth-status';
      statusEl.textContent = '';

      if(!email || !password){
        statusEl.classList.add('bad');
        statusEl.textContent = 'فضلاً عبّي الإيميل وكلمة المرور.';
        return;
      }

      authSubmitBtnEl.disabled = true;
      statusEl.textContent = 'جارِ المعالجة...';

      try{
        if(authMode === 'login'){
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          const name = nameEl ? nameEl.value.trim() : '';
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(cred.user.uid).set({
            email: email,
            displayName: name || email.split('@')[0],
            favorites: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        }
        currentTab = 'account';
        render(); // نعيد الرسم بس عند النجاح، عشان ما نمسح رسالة الخطأ عند الفشل
      } catch(err){
        statusEl.classList.add('bad');
        statusEl.textContent = translateAuthError(err.code);
        authSubmitBtnEl.disabled = false;
      }
    });
  }

  content.querySelectorAll('[data-speak]').forEach(el => el.addEventListener('click', () => speak(el.dataset.speak)));
  content.querySelectorAll('[data-fav]').forEach(el => el.addEventListener('click', () => toggleFav(el.dataset.fav)));
  const nationalAlertEl = content.querySelector('[data-open-national]');
  if(nationalAlertEl) nationalAlertEl.addEventListener('click', () => {
    currentTab = 'heritage'; heritageSection = 'national'; render();
  });
  const enableNotifEl = content.querySelector('[data-enable-notif]');
  if(enableNotifEl) enableNotifEl.addEventListener('click', () => requestNationalDayNotifications());
  const searchEl = document.getElementById('searchInput');
  if(searchEl){
    searchEl.addEventListener('input', (e) => { window.__lastSearch = e.target.value; render(); setTimeout(()=>{ const s=document.getElementById('searchInput'); if(s){ s.focus(); s.selectionStart=s.selectionEnd=s.value.length; } },0); });
  }
  const wordsSearchEl = document.getElementById('wordsSearchInput');
  if(wordsSearchEl){
    wordsSearchEl.addEventListener('input', (e) => { window.__wordsSearch = e.target.value; render(); setTimeout(()=>{ const s=document.getElementById('wordsSearchInput'); if(s){ s.focus(); s.selectionStart=s.selectionEnd=s.value.length; } },0); });
  }

  const suggestForm = document.getElementById('suggestForm');
  if(suggestForm){
    const starsEl = document.getElementById('sgStars');
    const starEls = starsEl ? Array.from(starsEl.querySelectorAll('.star')) : [];
    function paintStars(n){
      starEls.forEach(s => s.classList.toggle('active', Number(s.dataset.star) <= n));
    }
    starEls.forEach(s => {
      s.addEventListener('click', () => {
        const val = Number(s.dataset.star);
        const current = Number(starsEl.dataset.rating || 0);
        const newVal = (current === val) ? 0 : val; // إعادة الضغط على نفس النجمة يلغي التقييم
        starsEl.dataset.rating = newVal;
        paintStars(newVal);
      });
    });

    suggestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nameEl = document.getElementById('sg-name');
      const msgEl = document.getElementById('sg-msg');
      const nameErr = document.getElementById('sg-name-err');
      const msgErr = document.getElementById('sg-msg-err');
      const statusEl = document.getElementById('sg-status');
      const submitBtn = document.getElementById('sg-submit');

      const name = nameEl.value.trim();
      const email = currentUser ? currentUser.email : '';
      const msg = msgEl.value.trim();
      const rating = Number(starsEl ? starsEl.dataset.rating : 0);

      nameErr.classList.toggle('show', name === '');
      msgErr.classList.toggle('show', msg === '');

      if(name === '' || msg === '' || !currentUser){
        statusEl.textContent = '';
        statusEl.className = 'suggest-status';
        return;
      }

      submitBtn.disabled = true;
      statusEl.className = 'suggest-status';
      statusEl.textContent = 'جارِ الإرسال...';

      try{
        await db.collection('feedback').add({
          uid: currentUser.uid,
          name: name,
          email: email,
          rating: rating,
          message: msg,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        try{
          await fetch('https://formsubmit.co/ajax/uae.protocol262@gmail.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              name: name,
              email: email,
              rating: rating > 0 ? (rating + ' / 5 ⭐') : 'لم يُقيّم',
              message: msg,
              _subject: 'مقترح جديد من تطبيق البروتوكول الإماراتي'
            })
          });
        }catch(emailErr){ /* الإرسال الرئيسي عبر Firestore، الإيميل ثانوي */ }

        statusEl.classList.add('ok');
        statusEl.textContent = '✅ تم إرسال مقترحك، شاكرين لك تعاونك!';
        suggestForm.reset();
        if(starsEl){ starsEl.dataset.rating = 0; paintStars(0); }
      } catch(err){
        statusEl.classList.add('bad');
        statusEl.textContent = '⚠️ تعذّر الإرسال، تأكد من الاتصال بالإنترنت وحاول مرة ثانية.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  }

  const chatSendBtn = document.getElementById('chatSendBtn');
  const chatInputEl = document.getElementById('chatInput');
  function submitChat(){
    if(!chatInputEl) return;
    const val = chatInputEl.value;
    chatInputEl.value = '';
    askAssistant(val);
  }
  if(chatSendBtn){
    chatSendBtn.addEventListener('click', submitChat);
  }
  if(chatInputEl){
    chatInputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        submitChat();
      }
    });
  }
  content.querySelectorAll('[data-chat-suggest]').forEach(el => {
    el.addEventListener('click', () => askAssistant(el.dataset.chatSuggest));
  });

  updateScrollHint();
  setTimeout(updateScrollHint, 50);
}

function updateScrollHint(){
  const content = document.getElementById('content');
  const hint = document.getElementById('scrollHint');
  if(!content || !hint) return;
  if(currentTab === 'assistant'){ hint.classList.remove('show'); return; }
  const hasMore = content.scrollHeight - content.scrollTop - content.clientHeight > 40;
  hint.classList.toggle('show', hasMore);
}

document.getElementById('content').addEventListener('scroll', updateScrollHint);
window.addEventListener('resize', updateScrollHint);
document.getElementById('scrollHint').addEventListener('click', () => {
  const content = document.getElementById('content');
  content.scrollBy({ top: content.clientHeight * 0.75, behavior: 'smooth' });
});

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    currentTab = el.dataset.tab; catDetail = null; heritageSection = null; window.__lastSearch=''; render();
  });
});

document.getElementById('aiFab').addEventListener('click', () => {
  currentTab = 'assistant'; catDetail = null; heritageSection = null; render();
});

document.getElementById('acctBtn').addEventListener('click', () => {
  currentTab = 'account'; catDetail = null; heritageSection = null; render();
});

function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});
}
tickClock(); setInterval(tickClock, 30000);

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  currentUserProfile = null;
  const acctBtnEl = document.getElementById('acctBtn');
  if(acctBtnEl){
    acctBtnEl.classList.toggle('logged', !!user);
    acctBtnEl.textContent = user ? (user.email[0].toUpperCase()) : '👤';
  }
  if(user){
    try{
      const doc = await db.collection('users').doc(user.uid).get();
      if(doc.exists) currentUserProfile = doc.data();
    }catch(e){}
  } else {
    favorites = [];
    adminStats = null;
    if(currentTab === 'admin') currentTab = 'account';
  }
  await loadFavorites();
  render();
});

loadNotifState().then(() => { render(); checkAndFireNotification(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
